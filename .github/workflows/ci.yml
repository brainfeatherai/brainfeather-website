name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run eval:retrieval
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_APPWRITE_ENDPOINT: https://example.invalid/v1
          NEXT_PUBLIC_APPWRITE_PROJECT_ID: build-placeholder
          NEXT_PUBLIC_APPWRITE_DATABASE_ID: brainfeather
          APPWRITE_API_KEY: build-placeholder

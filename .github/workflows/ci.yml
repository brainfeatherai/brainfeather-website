name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run eval:retrieval
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_APPWRITE_ENDPOINT: https://example.invalid/v1
          NEXT_PUBLIC_APPWRITE_PROJECT_ID: build-placeholder
          NEXT_PUBLIC_APPWRITE_DATABASE_ID: brainfeather
          APPWRITE_API_KEY: build-placeholder
          BRAINFEATHER_DATA_ENCRYPTION: encrypted
          BRAINFEATHER_DATA_ENCRYPTION_KEYS: v1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          BRAINFEATHER_DATA_INDEX_KEY: BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
          BRAINFEATHER_API_KEY_STORAGE: hashed
          BRAINFEATHER_SESSION_SECRET: build-session-secret-with-at-least-32-characters
          BRAINFEATHER_RATE_LIMIT_SECRET: build-rate-limit-secret-with-at-least-32-characters
